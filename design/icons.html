<!doctype html>
<!-- Source for the PNG icons. Render with ?size=180&bg=1 (apple-touch-icon) or ?size=32 (favicon-32.png). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}
div{display:flex;align-items:center;justify-content:center}</style></head>
<body><div id="b"><img id="i" src="../site/favicon.svg" alt=""></div>
<script>var p=new URLSearchParams(location.search),s=+p.get('size')||32,b=document.getElementById('b'),i=document.getElementById('i');
b.style.width=b.style.height=s+'px';if(p.get('bg')){b.style.background='#fff';i.style.width=i.style.height=Math.round(s*.72)+'px'}else{i.style.width=i.style.height=s+'px'}</script>
</body></html>
